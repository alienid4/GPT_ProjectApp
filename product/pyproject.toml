[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "it-workboard"
version = "0.1.0"
description = "Internal architecture department work management"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<3.2", "SQLAlchemy>=2.0,<2.1", "alembic>=1.14,<2",
  "ldap3==2.9.1", "openpyxl>=3.1,<4", "pyodbc>=5,<6"
]

[project.optional-dependencies]
server = ["gunicorn>=23,<24"]
test = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workboard = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
