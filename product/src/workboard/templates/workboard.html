<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作管理平台</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><script src="{{ url_for('static', filename='board.js') }}" defer></script><script src="{{ url_for('static', filename='management.js') }}" defer></script></head>
<body><div class="product-shell"><aside class="sidebar"><div class="product-brand"><span class="brand-mark">工</span><strong>系統架構科<br><small>工作管理平台</small></strong></div><nav id="navigation" aria-label="主要功能"></nav><div class="sidebar-bottom"><span id="identity">{{ user.name }}</span><button id="logout">登出</button></div></aside>
<main class="product-main"><header class="topbar"><span id="section-label">工作台</span><div class="top-meta"><time id="clock"></time><span>{{ '測試環境' if mode == 'test' else '內網系統' }} · v{{ version }} · {{ build }}</span></div></header><nav id="tabs" class="tabs" aria-label="功能頁面"></nav>
<section id="workspace"><div class="page-heading"><h1 id="page-title">我的工作</h1><div id="page-actions"></div></div><div class="toolbar"><input id="search" type="search" aria-label="搜尋本頁" placeholder="搜尋本頁"><select id="sort" aria-label="排序"><option value="priority">優先順序</option><option value="title">名稱</option><option value="code">編號</option><option value="target_on">目標日期</option><option value="status">狀態</option></select><button id="sort-direction" aria-label="切換排序方向">↑</button><select id="execution-filter" aria-label="執行狀態"><option value="active">有效工作</option><option value="paused">暫停工作</option><option value="cancelled">已取消</option><option value="all">全部紀錄</option></select><button id="refresh">重新整理</button><span class="scope">目前授權範圍</span><select id="export-format" aria-label="匯出格式"><option value="">匯出</option><option value="xlsx">Excel</option><option value="csv">CSV</option><option value="md">Markdown</option></select></div><p id="page-error" class="error" role="alert"></p><div id="content" aria-live="polite"></div></section></main></div>
<dialog id="detail" class="detail"><div class="dialog-head"><h2 id="dialog-title"></h2><button data-close aria-label="關閉明細">✕</button></div><div id="dialog-content"></div><p id="dialog-error" class="error" role="alert"></p></dialog><div id="toast" role="status" hidden></div></body></html>
